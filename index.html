<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1d22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RoN Maps — Sinuous Trail</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== HUB (mission picker) ===================== -->
  <section class="hub" id="hub">
    <header class="hub-head">
      <div class="hub-top">
        <h1 class="hub-title">Ready or Not — Maps</h1>
        <button id="installBtn" class="install-btn" hidden>⤓ Install</button>
      </div>
      <p class="hub-sub">Pick a mission</p>
      <div class="hub-controls">
        <input id="missionSearch" class="mission-search" type="search"
               inputmode="search" placeholder="Search missions…" aria-label="Search missions" />
        <label class="toggle">
          <input type="checkbox" id="hideComingSoon" />
          <span>Hide coming soon</span>
        </label>
      </div>
      <p class="ios-install-hint" id="iosHint" hidden>To install: tap the Share button, then “Add to Home Screen”.</p>
    </header>
    <div class="mission-grid" id="missionGrid"></div>
    <p class="hub-empty" id="hubEmpty" hidden>No missions match your search.</p>
    <footer class="app-foot" id="appFoot"></footer>
  </section>

  <div class="offline-badge" id="offlineBadge" hidden>● Offline</div>
  <div class="toast" id="toast" hidden></div>

  <!-- Shown when the app is opened from a shared plan link -->
  <div class="modal" id="shareImport" hidden>
    <div class="sheet">
      <h2 class="sheet-title">Shared plan</h2>
      <p class="sheet-body" id="shareSummary"></p>
      <div class="sheet-actions">
        <button id="shareMergeBtn" class="tool">Add to my marks</button>
        <button id="shareReplaceBtn" class="tool tool-danger">Replace my marks</button>
        <button id="shareCancelBtn" class="tool">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ===================== MAP VIEW ===================== -->
  <header class="toolbar" id="toolbar" hidden>
    <div class="tb-group">
      <button id="backBtn" class="tool" title="Back to missions">‹<span class="tool-txt"> Missions</span></button>
    </div>
    <div class="tb-group tb-maps">
      <span class="tb-title" id="missionTitle"></span>
    </div>

    <div class="tb-group">
      <button id="stampXBtn" class="tool active" aria-pressed="true" title="Stamp X (tap the map)">
        <span class="tool-x">✕</span><span class="tool-txt">X</span>
      </button>
      <button id="stampWBtn" class="tool" aria-pressed="false" title="Stamp W (tap the map)">
        <span class="tool-x">W</span><span class="tool-txt">W</span>
      </button>
      <button id="arrowBtn" class="tool" aria-pressed="false" title="Arrow — drag to draw a route">
        <span class="tool-x">↗</span><span class="tool-txt">Arrow</span>
      </button>
      <button id="penBtn" class="tool" aria-pressed="false" title="Pen — drag to draw freehand">
        <span class="tool-x">✎</span><span class="tool-txt">Pen</span>
      </button>
      <button id="eraserBtn" class="tool" aria-pressed="false" title="Eraser (tap a mark to remove)">
        <span class="tool-ico">▭</span><span class="tool-txt">Eraser</span>
      </button>
    </div>

    <div class="tb-group tb-colors" id="swatches" role="group" aria-label="Marker color"></div>

    <div class="tb-group">
      <label class="color-chip" title="Pick a custom color">
        <input type="color" id="colorInput" value="#e02424" />
      </label>
    </div>

    <div class="tb-group">
      <button id="undoBtn" class="tool" title="Undo">↶<span class="tool-txt">Undo</span></button>
      <button id="redoBtn" class="tool" title="Redo">↷<span class="tool-txt">Redo</span></button>
      <button id="resetBtn" class="tool tool-danger" title="Clear all marks on every floor">⟲<span class="tool-txt">Reset</span></button>
    </div>

    <div class="tb-group">
      <button id="shareBtn" class="tool" title="Copy a link to this marked-up mission">⇪<span class="tool-txt">Share</span></button>
    </div>

    <div class="tb-group tb-size" id="sizeGroup" hidden>
      <label class="tb-label" for="sizeRange">Size</label>
      <input type="range" id="sizeRange" min="16" max="220" value="64" />
    </div>

    <div class="tb-group tb-floornav" id="floorNav" role="group" aria-label="Jump to floor"></div>
  </header>

  <main class="stage" id="stage" hidden>
    <div class="floor-scroll" id="floorScroll"></div>
    <div class="hint" id="hint">Tap to stamp · scroll for floors · double-tap to zoom.</div>
  </main>

  <script src="js/maps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
