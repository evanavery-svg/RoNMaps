<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1d22" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RoN Maps — Sinuous Trail</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== HUB (mission picker) ===================== -->
  <section class="hub" id="hub">
    <header class="hub-head">
      <h1 class="hub-title">Ready or Not — Maps</h1>
      <p class="hub-sub">Pick a mission</p>
    </header>
    <div class="mission-grid" id="missionGrid"></div>
    <footer class="app-foot" id="appFoot"></footer>
  </section>

  <!-- ===================== MAP VIEW ===================== -->
  <header class="toolbar" id="toolbar" hidden>
    <div class="tb-group">
      <button id="backBtn" class="tool" title="Back to missions">‹<span class="tool-txt"> Missions</span></button>
    </div>
    <div class="tb-group tb-maps">
      <span class="tb-title" id="missionTitle"></span>
    </div>

    <div class="tb-group">
      <button id="stampBtn" class="tool active" aria-pressed="true" title="Stamp X (tap the map)">
        <span class="tool-x">✕</span><span class="tool-txt">Stamp</span>
      </button>
      <button id="eraserBtn" class="tool" aria-pressed="false" title="Eraser (tap an X to remove)">
        <span class="tool-ico">▭</span><span class="tool-txt">Eraser</span>
      </button>
    </div>

    <div class="tb-group tb-colors" id="swatches" role="group" aria-label="Marker color"></div>

    <div class="tb-group">
      <label class="color-chip" title="Pick a custom color">
        <input type="color" id="colorInput" value="#e02424" />
      </label>
    </div>

    <div class="tb-group">
      <button id="undoBtn" class="tool" title="Undo">↶<span class="tool-txt">Undo</span></button>
      <button id="resetBtn" class="tool tool-danger" title="Clear all marks on this map">⟲<span class="tool-txt">Reset</span></button>
    </div>

    <div class="tb-group tb-size" id="sizeGroup" hidden>
      <label class="tb-label" for="sizeRange">Size</label>
      <input type="range" id="sizeRange" min="16" max="220" value="64" />
    </div>
  </header>

  <main class="stage" id="stage" hidden>
    <div class="floor-scroll" id="floorScroll"></div>
    <div class="hint" id="hint">Tap a room to stamp an X · scroll for other floors · pinch to zoom.</div>
  </main>

  <script src="js/maps.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
